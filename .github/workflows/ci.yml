name: ci

# 机械门清单（对应实施计划任务 1 与 06 号规格 §4.2）：
#   1. 不变量测试（含 import 方向门、工具重叠门、预算与审计门）
#   2. 设计知识索引校验（结构 / 依赖方向 / 体积预算 / 到期复审）
#   3. 契约生成区一致性
#   4. 密钥不得入库
#
# 门禁必须机械判定，不依赖"记得检查"。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi>=0.115" "uvicorn>=0.32" "pydantic>=2.9" "PyYAML>=6.0" "pytest>=8.3" "httpx>=0.27"

      - name: 不变量测试
        run: python -m pytest -q -p no:warnings

      - name: 设计知识索引校验
        run: python tools/skills/check_manifest.py docs/skills/manifest.yaml

      - name: 契约生成区一致性
        run: |
          python tools/skills/gen_contracts.py --target sql-schema --check
          python tools/skills/gen_contracts.py --target protocol --check
          python tools/skills/gen_contracts.py --target tool-catalog --check

      - name: 密钥不得入库
        run: |
          tracked=$(git ls-files)
          if echo "$tracked" | grep -E '(^|/)\.env$'; then
            echo "::error::检测到 .env 被纳入版本控制（项目红线：密钥不进仓库）"
            exit 1
          fi
          if echo "$tracked" | grep -E '\.(pem|key)$'; then
            echo "::error::检测到私钥文件被纳入版本控制"
            exit 1
          fi
          echo "密钥检查通过"
