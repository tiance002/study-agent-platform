name: ci

# 机械门清单（对应实施计划任务 1 与 06 号规格 §4.2）：
#   1. 不变量测试（含 import 方向门、工具重叠门、预算与审计门）
#   2. 静态检查（ruff）—— 只启用能发现真实缺陷的规则集
#   3. 类型检查（mypy）
#   4. 设计知识索引校验（结构 / 依赖方向 / 体积预算 / 到期复审）
#   5. 契约生成区一致性（重新渲染比对内容，不只比哈希）
#   6. 数据库迁移校验（当前 [SKIP]，未引入 Alembic；跳过 ≠ 通过）
#   7. 依赖许可证扫描（copyleft 会带来分发义务，必须当场知道）
#   8. 秘密扫描（文件名 + 内容，内容扫描才是主门）
#
# 门禁必须机械判定，不依赖"记得检查"。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        # 从 pyproject 的 dev extras 装，而不是在这里硬编码版本清单 ——
        # 否则本地与 CI 的依赖会各自漂移，本地跑通的门禁在 CI 上失败。
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: 不变量测试
        run: python -m pytest -q -p no:warnings

      - name: 静态检查（ruff）
        run: python -m ruff check backend tools

      - name: 类型检查（mypy）
        run: python -m mypy backend/app --ignore-missing-imports

      - name: 设计知识索引校验
        run: python tools/skills/check_manifest.py docs/skills/manifest.yaml

      - name: 契约生成区一致性
        run: |
          python tools/skills/gen_contracts.py --target sql-schema --check
          python tools/skills/gen_contracts.py --target protocol --check
          python tools/skills/gen_contracts.py --target tool-catalog --check

      - name: 数据库迁移校验
        run: python tools/migrations/check_migrations.py

      - name: 依赖许可证扫描
        run: python tools/security/scan_licenses.py

      - name: 秘密扫描（文件名 + 内容）
        run: |
          tracked=$(git ls-files)
          if echo "$tracked" | grep -E '(^|/)\.env$|\.(pem|key)$'; then
            echo "::error::检测到密钥类文件被纳入版本控制（项目红线：密钥不进仓库）"
            exit 1
          fi
          # 文件名检查拦不住写在源码/配置/文档里的 token —— 内容扫描才是主门
          python tools/security/scan_secrets.py
