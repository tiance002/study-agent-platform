# Alembic configuration.
#
# THIS FILE IS INTENTIONALLY PURE ASCII.
#   configparser reads it with encoding="locale", which on a Chinese Windows
#   is GBK. A UTF-8 Chinese comment therefore crashes `alembic` with
#   UnicodeDecodeError before any of our own Python runs. Same class of trap
#   as the .cmd scripts - see the note in README.md.
#
# THIS FILE CONTAINS NO DATABASE URL AND NO PASSWORD.
#   alembic/env.py reads the connection string from the environment:
#
#     STUDY_PLATFORM_MIGRATION_DSN
#
#   The migration role and the application role MUST be different:
#   migrations need DDL rights, and the application role (study_app) must not
#   have them - otherwise one mistake can alter table structure or sidestep
#   RLS entirely.
#
#   The default in env.py points at the local development database only.
#   Production must supply the value explicitly, via KMS / Secret Manager.

[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
timezone = UTC

# sqlalchemy.url is intentionally absent - see alembic/env.py.
