server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 120.55.115.162;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 200 "Study Plan TLS setup in progress.\n";
        default_type text/plain;
    }
}
