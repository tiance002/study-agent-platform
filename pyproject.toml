[project]
name = "study-agent-platform"
version = "0.1.0"
description = "Agent 工程学习规划平台 —— 批次一最小闭环（开发适配器版）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "PyYAML>=6.0",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
# ruff 与 mypy 放在 dev extras 里，而不是只装在 CI 上：
# 本地跑不通的门禁，等推到 CI 才发现就已经晚了。
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]
# PostgreSQL 持久化。内存适配器模式不需要这组 —— 核心域保持可独立安装。
# ⚠️ psycopg 是 LGPL-3.0：引入决策与理由记录在
#    tools/security/license_allowlist.txt，许可证扫描门据此放行。
postgres = [
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "SQLAlchemy>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]
addopts = "-q --strict-markers"
markers = [
    "invariant: 直接对应一条系统不变量的机械证明测试",
    "postgres: 需要本地 PostgreSQL 运行；不可达时整组跳过（scripts\\pg_start.cmd）",
]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["var", ".venv", "node_modules"]

[tool.ruff.lint]
# 只启用能发现**真实缺陷**的规则集。
# 不做纯风格约束 —— 风格交给 formatter，lint 只该拦 bug 与不一致。
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E501",  # 行长度：交给 formatter，不在 lint 里制造噪音
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["B011"]  # 允许测试里出现 assert False 之类的写法

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]
